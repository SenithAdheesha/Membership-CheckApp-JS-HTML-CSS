<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial; text-align: center; padding: 30px; }
    input { padding: 10px; width: 250px; }
    button { padding: 10px 20px; margin-top: 10px; }
    #result { margin-top: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <h2>Check Your Membership</h2>

  <input type="text" id="memberId" placeholder="Enter Membership Number">
  <br>
  <button onclick="search()">Search</button>

  <div id="result"></div>

  <script>
    function search() {
      var id = document.getElementById("memberId").value.trim();
      if (!id) {
        document.getElementById("result").innerHTML = "Please enter your Membership Number";
        return;
      }
      document.getElementById("result").innerHTML = "Checking Please wait...";

      google.script.run.withSuccessHandler(function(res) {
        document.getElementById("result").innerHTML = res;
      }).searchMember(id);
    }
  </script>
</body>
</html>
